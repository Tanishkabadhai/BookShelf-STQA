{% extends "base.html" %}
{% block title %}Log in - BookShelf{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h2 class="display">Your shelves, in order.</h2>
    <p class="lede">Catalogue every book you own, lend or plan to read, and find any of them in seconds.</p>
    <figure class="frame">
      <img src="{{ url_for('static', filename='img/desk.jpg') }}" alt="Open books and an oil lamp on a wooden desk">
      <figcaption>Pick up where you left off.</figcaption>
    </figure>
  </div>
  <div class="panel card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to see your collection.</p>
    <form method="post" novalidate>
      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="you@example.com" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <div class="actions"><button type="submit" id="login-btn" class="btn">Log in</button></div>
    </form>
    <p class="switch">New here? <a id="register-link" href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
