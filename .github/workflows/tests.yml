name: Selenium regression cycles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p reports
          google-chrome --version

      # Shows where every file really is. If a file (for example ci_summary.py) is not next to
      # app.py, you will see it here.
      - name: Show repository layout
        run: find . -maxdepth 2 -not -path './.git/*' -not -path './.git' | sort

      # Catches a copy-paste mistake (missing line, bad indentation) and names the file and line.
      - name: Check that the Python files are intact
        run: python -m compileall -q app.py verify_modes.py run_cycles.py tests

      - name: Seeded defects exist only in v1.0 (no browser)
        run: python verify_modes.py

      # Cycle 1 is SUPPOSED to find failures: they are the 8 seeded bugs.
      # The step always ends successfully, so these expected failures never turn the run red.
      - name: Cycle 1 - full suite on buggy build v1.0 (failures are expected)
        env:
          APP_MODE: buggy
          REPORT_TAG: cycle1_buggy_full
        run: |
          set +e
          python -m pytest -v --tb=short --html=reports/cycle1_buggy_full.html --self-contained-html 2>&1 | tee reports/log_cycle1.txt
          echo "Cycle 1 finished. Failing tests here are the seeded bugs being found."
          exit 0

      # Retest = rerun exactly the tests that target the 8 seeded defects (marker "defect").
      - name: Cycle 2 - retest the defect cases on fixed build v1.1
        if: always() && steps.install.outcome == 'success'
        env:
          APP_MODE: fixed
          REPORT_TAG: cycle2_fixed_retest
        run: python -m pytest -m defect -v --tb=short --html=reports/cycle2_fixed_retest.html --self-contained-html 2>&1 | tee reports/log_cycle2.txt

      - name: Cycle 3 - full regression on fixed build v1.1
        if: always() && steps.install.outcome == 'success'
        env:
          APP_MODE: fixed
          REPORT_TAG: cycle3_fixed_regression
        run: python -m pytest -v --tb=short --html=reports/cycle3_fixed_regression.html --self-contained-html 2>&1 | tee reports/log_cycle3.txt

      - name: Results summary
        if: always()
        run: |
          if [ -f ci_summary.py ]; then
            python ci_summary.py >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ci_summary.py was not found. Put it in the main folder, next to app.py." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
