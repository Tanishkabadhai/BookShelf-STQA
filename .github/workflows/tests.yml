name: Selenium regression cycles

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p reports
          google-chrome --version

      - name: Seeded defects exist only in v1.0 (no browser)
        run: python verify_modes.py

      # Cycle 1 is EXPECTED to fail (that is the point: it finds the seeded bugs),
      # so this step is allowed to fail without turning the whole run red.
      - name: Cycle 1 - full suite on buggy build v1.0
        id: cycle1
        continue-on-error: true
        env:
          APP_MODE: buggy
          REPORT_TAG: cycle1_buggy_full
        run: python -m pytest -v --tb=short --html=reports/cycle1_buggy_full.html --self-contained-html 2>&1 | tee reports/log_cycle1.txt

      # Retest = rerun exactly the tests that target the 8 seeded defects (marker "defect").
      # Uses the marker, not pytest's cache, so it does not depend on cycle 1 having run.
      - name: Cycle 2 - retest the defect cases on fixed build v1.1
        if: always() && steps.install.outcome == 'success'
        env:
          APP_MODE: fixed
          REPORT_TAG: cycle2_fixed_retest
        run: python -m pytest -m defect -v --tb=short --html=reports/cycle2_fixed_retest.html --self-contained-html 2>&1 | tee reports/log_cycle2.txt

      - name: Cycle 3 - full regression on fixed build v1.1
        if: always() && steps.install.outcome == 'success'
        env:
          APP_MODE: fixed
          REPORT_TAG: cycle3_fixed_regression
        run: python -m pytest -v --tb=short --html=reports/cycle3_fixed_regression.html --self-contained-html 2>&1 | tee reports/log_cycle3.txt

      - name: Results summary
        if: always()
        run: python ci_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
